<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>MacSecCollect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶部标题栏拖拽区域 -->
  <div class="titlebar"></div>

  <!-- 主内容 -->
  <div class="container">

    <!-- 中心扫描区域 -->
    <div class="scan-area" id="scanArea">
      <img class="shield-icon" id="shieldIcon" src="../assets/icon.png" alt="MacSecCollect">

      <!-- 步骤提示 -->
      <div class="step-hint step-hint-warn" id="stepHint">
        ⚠️ 第一步：请先点「联网采集」（保持联网），采集完成后立即断网
      </div>

      <!-- 双按钮 -->
      <div class="btn-group">
        <button class="scan-btn scan-btn-online" id="onlineBtn">
          <span class="btn-icon">📡</span>
          <span class="btn-text">联网采集</span>
        </button>
        <button class="scan-btn scan-btn-offline" id="offlineBtn" disabled>
          <span class="btn-icon">🔒</span>
          <span class="btn-text">断网采集</span>
        </button>
      </div>

      <!-- 进度条 -->
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-text" id="progressText">0 / 15</span>
      </div>
    </div>

    <!-- 日志区域 -->
    <div class="log-area" id="logArea">
      <div class="log-content" id="logContent"></div>
    </div>

    <!-- 完成后文件面板（默认隐藏） -->
    <div class="result-panel" id="resultPanel">
      <div class="result-info">
        <span class="result-icon">📦</span>
        <div class="result-details">
          <span class="result-filename" id="resultFilename">-</span>
          <span class="result-size" id="resultSize">-</span>
        </div>
      </div>
      <div class="result-actions">
        <button class="action-btn" id="finderBtn">
          <span>📂</span> 在 Finder 中显示
        </button>
        <button class="action-btn" id="copyBtn">
          <span>📋</span> 复制文件路径
        </button>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
